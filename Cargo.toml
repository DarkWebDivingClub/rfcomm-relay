[package]
name = "rfcomm-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17", features = ["rfcomm", "bluetoothd"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
uuid = "1"
